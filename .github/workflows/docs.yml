name: README media
# A docs-only change skips windows.yml, so the README's image check (test/readme-media.test.mjs,
# also part of npm test there) runs here on its own: every docs/media file the README points at
# exists, and every image has alt text and its caption.
on:
  pull_request:
    paths: ['README.md', 'docs/media/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['README.md', 'docs/media/**', '.github/workflows/docs.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked dependencies without install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: README media check
        run: npx vitest run test/readme-media.test.mjs
