name: Glass preview smoke
# Browser journeys over the built Glass and control panel, only when what they render may have
# changed. Typecheck and tests are not repeated here: windows.yml is the authoritative check.
on:
  pull_request:
    paths:
      - 'companion/src/overlay/**'
      - 'companion/src/control/**'
      - 'companion/src/shared/**'
      - 'companion/src/assets/**'
      - 'companion/src/hub/viewmodel.ts'
      - 'companion/src/main/preload-*.ts'
      - 'companion/src/main/physical.ts' # control panel: approve-key labels
      - 'companion/scripts/build.mjs'
      - 'companion/scripts/bundles.mjs'
      - 'companion/scripts/preview*'
      - 'companion/scripts/*-journey.mjs'
      - 'companion/scripts/render-media.mjs'
      - 'companion/package-lock.json'
      - '.github/workflows/glass-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: companion
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked application dependencies without install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the actual renderers
        run: npm run build
      - name: Install isolated pinned browser QA tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/familiar-qa" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/familiar-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise synthetic Glass and capture evidence
        env:
          FAMILIAR_QA_MODULE: ${{ runner.temp }}/familiar-qa/node_modules/playwright/index.mjs
        run: node scripts/preview-smoke.mjs
      # The README and release-page images render from the same fixtures; fails if any PNG is missing.
      - name: Render the README media
        env:
          FAMILIAR_QA_MODULE: ${{ runner.temp }}/familiar-qa/node_modules/playwright/index.mjs
        run: node scripts/render-media.mjs --out "$RUNNER_TEMP/media"
      - name: Upload screenshots, trace, and checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glass-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: companion/preview-evidence/
          if-no-files-found: warn
          retention-days: 14
