name: Windows verify
on:
  # addon/** too: npm test runs the addon API-conformance and Lua<->TS codec parity checks.
  # Never pull_request_target: PR code must not run with repository privileges.
  pull_request:
    paths: ['companion/**', 'addon/**', 'Run Familiar.cmd', '.github/workflows/windows.yml']
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so v* tags always run.
    tags: ['v*']
    paths: ['companion/**', 'addon/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install locked application dependencies without install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # README promises no telemetry. fetch/http can't be grepped naively (dependencies mention
      # them), so this checks only for Electron's crash reporter and auto-updater.
      - name: Bundle contains no crash reporter or auto-updater
        run: |
          if grep -l -E "crashReporter|autoUpdater" dist/main.js; then
            echo "::error file=companion/dist/main.js::crashReporter/autoUpdater found in the main bundle"
            exit 1
          fi
      # The release download, built and checked the way release.yml does it (scripts/prebuilt.mjs),
      # on pull requests and manual runs only: pushes to main skip it, and a tag builds the real one.
      # The artifact is the zip to try by hand on a PC; it is kept for 3 days.
      - name: Build the prebuilt app zip
        if: github.event_name != 'push'
        run: node scripts/prebuilt.mjs build "$RUNNER_TEMP/app/FamiliarApp-check-windows.zip" HEAD
      - name: Check the zip and self-test it without Node
        if: github.event_name != 'push'
        run: node scripts/prebuilt.mjs check "$RUNNER_TEMP/app/FamiliarApp-check-windows.zip"
      - name: Upload the app zip for a manual test
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FamiliarApp-${{ github.event.pull_request.head.sha || github.sha }}-windows
          path: ${{ runner.temp }}/app/FamiliarApp-check-windows.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0 # already a zip
